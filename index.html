<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dream Website</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="col-1">
            <div class="bloco">
                <h3>Calendar</h3>
                <div id="mostrar-calendario"></div>
            </div>

            <div class="bloco">
                <h3>Cronômetro</h3>
                <div id="tempo" style="font-size: 20px;">00:00:00</div>
                <button onclick="iniciar()">Iniciar</button>
                <button onclick="parar()">Parar</button>
                <button onclick="limapar()">Limpar</button>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('input, textarea').forEach((field) => {
                    field.setAttribute('autocomplete', 'off');
                    field.setAttribute('autocorrect', 'off');
                    field.setAttribute('autocapitalize', 'off');
                    field.setAttribute('spellcheck', 'false');
                });
            });
        </script>
    </body>
</html>
